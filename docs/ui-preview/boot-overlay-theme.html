<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stash · 开库加载（主题适配版）</title>
<style>
  /* ============================================================
     变量逐字抄自 src/assets/styles/main.css
     深色 = :root，浅色 = [data-theme="light"]
     除图片色块外，本文件不写死任何颜色。
     ============================================================ */
  :root {
    --bg-app:     #0D0D0E;
    --bg-panel:   #181818;
    --bg-canvas:  #1F1F20;
    --bg-raised:  #262628;
    --bg-media:   #0F0F10;
    --bg-input:   rgba(255, 255, 255, 0.045);
    --bg-hover:   rgba(255, 255, 255, 0.06);

    --border:      #2E2E30;
    --border-soft: rgba(255, 255, 255, 0.07);

    --text-1: #F2F4F6;
    --text-2: #A9B0B8;
    --text-3: #8C949D;

    --accent:        #4795FF;
    --accent-soft:   rgba(71, 149, 255, 0.16);
    --accent-border: rgba(71, 149, 255, 0.50);

    --shadow-modal: 0 20px 48px rgba(0, 0, 0, 0.55);
    --hairline: rgba(255, 255, 255, 0.18);
    --track: rgba(255, 255, 255, 0.14);

    --font: "MiSans", "HarmonyOS Sans SC", "Source Han Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    color-scheme: dark;
  }

  [data-theme="light"] {
    --bg-app:     #E8E4DC;
    --bg-panel:   #F6F2EA;
    --bg-canvas:  #FBF8F2;
    --bg-raised:  #FFFDF8;
    --bg-media:   #EDE9E1;
    --bg-input:   rgba(0, 0, 0, 0.045);
    --bg-hover:   rgba(0, 0, 0, 0.05);

    --border:      #E2DCD1;
    --border-soft: rgba(0, 0, 0, 0.07);

    --text-1: #2A251E;
    --text-2: #6B655C;
    --text-3: #736C60;

    --accent:        #2C74D8;
    --accent-soft:   rgba(44, 116, 216, 0.14);
    --accent-border: rgba(44, 116, 216, 0.45);

    --shadow-modal: 0 12px 32px rgba(74, 60, 40, 0.18);
    --hairline: rgba(0, 0, 0, 0.06);
    --track: rgba(0, 0, 0, 0.12);

    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(90% 70% at 50% -10%, var(--bg-canvas) 0%, var(--bg-app) 62%, var(--bg-app) 100%);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease;
  }

  /* ================= 应用窗口 ================= */
  .app {
    position: relative;
    width: min(1280px, 95vw);
    height: min(812px, 91vh);
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg-app);
    box-shadow: 0 50px 120px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border-soft);
    transition: background 0.3s ease;
  }

  /* ---------- 标题栏 ---------- */
  .titlebar {
    height: 42px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
  }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .tb-title { font-size: 12.5px; color: var(--text-2); letter-spacing: 0.2px; }
  .tb-right { margin-left: auto; display: flex; gap: 18px; color: var(--text-3); font-size: 12px; }

  /* ---------- 三栏 ---------- */
  .body {
    display: grid;
    grid-template-columns: 226px 1fr 268px;
    height: calc(100% - 42px);
  }

  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--bg-panel);
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .lib-name { font-size: 14px; font-weight: 500; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
  .lib-name span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .new-btn {
    height: 28px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-raised);
    color: var(--text-2);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sec-label { font-size: 11px; color: var(--text-3); letter-spacing: 0.6px; margin-bottom: 8px; }
  .tree { display: flex; flex-direction: column; gap: 2px; }
  .tree div {
    height: 27px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    font-size: 12.5px;
    color: var(--text-2);
  }
  .tree div.on { background: var(--accent-soft); color: var(--text-1); }
  .tree i { width: 12px; height: 12px; border-radius: 3px; background: var(--border); flex: none; }
  .tree em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--text-3); }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    height: 22px;
    padding: 0 9px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: var(--bg-raised);
    font-size: 11.5px;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .main { background: var(--bg-canvas); padding: 16px 18px; overflow: hidden; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .toolbar h2 { margin: 0; font-size: 13.5px; font-weight: 500; color: var(--text-1); }
  .toolbar .pill {
    margin-left: auto;
    height: 26px;
    padding: 0 11px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-raised);
    font-size: 11.5px;
    color: var(--text-2);
    display: flex;
    align-items: center;
  }

  .grid { column-count: 4; column-gap: 10px; }
  .tile {
    break-inside: avoid;
    margin: 0 0 10px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border-soft);
    background: var(--bg-media);
  }
  .tile::after {
    content: "";
    position: absolute;
    left: 8px; right: 8px; bottom: 7px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.16);
  }
  /* 图片色块是“素材本身”，不跟主题走 */
  .t1 { height: 148px; background: linear-gradient(135deg, #2a3b57, #4c6288); }
  .t2 { height: 196px; background: linear-gradient(135deg, #382e4e, #6a4f8c); }
  .t3 { height: 122px; background: linear-gradient(135deg, #27423d, #3f6f66); }
  .t4 { height: 176px; background: linear-gradient(135deg, #453626, #7a5a3c); }
  .t5 { height: 134px; background: linear-gradient(135deg, #2c3a4a, #526172); }
  .t6 { height: 168px; background: linear-gradient(135deg, #3b2f3f, #6d5470); }
  .t7 { height: 142px; background: linear-gradient(135deg, #243d46, #3f6b78); }
  .t8 { height: 188px; background: linear-gradient(135deg, #3d3a2a, #6f6845); }
  .t9 { height: 130px; background: linear-gradient(135deg, #2f3448, #515a7d); }
  .t10 { height: 158px; background: linear-gradient(135deg, #3a2f2c, #6b534c); }
  .t11 { height: 144px; background: linear-gradient(135deg, #283d35, #476b5d); }
  .t12 { height: 180px; background: linear-gradient(135deg, #333047, #5a5378); }

  .detail { border-left: 1px solid var(--border); background: var(--bg-panel); padding: 16px 15px; }
  .hero {
    height: 176px;
    border-radius: 9px;
    background: linear-gradient(135deg, #2b3a55, #4a5f86);
    border: 1px solid var(--border-soft);
    margin-bottom: 14px;
  }
  .meta-line { height: 10px; border-radius: 4px; background: var(--bg-input); margin-bottom: 9px; }
  .meta-line.w60 { width: 60%; }
  .meta-line.w80 { width: 80%; }
  .meta-line.w45 { width: 45%; }
  .block {
    margin-top: 16px;
    height: 66px;
    border-radius: 8px;
    background: var(--bg-raised);
    border: 1px solid var(--border-soft);
  }

  /* ================= 全屏遮罩 ================= */
  .veil {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--bg-app) 42%, transparent);
    -webkit-backdrop-filter: blur(22px) saturate(1.3) brightness(0.8);
    backdrop-filter: blur(22px) saturate(1.3) brightness(0.8);
    animation: veilIn 0.45s ease-out both;
    transition: background 0.3s ease;
  }
  [data-theme="light"] .veil {
    background: color-mix(in srgb, var(--bg-canvas) 40%, transparent);
    -webkit-backdrop-filter: blur(16px) saturate(1.1) brightness(1);
    backdrop-filter: blur(16px) saturate(1.1) brightness(1);
  }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }

  /* 氛围光：深色用 accent 蓝为主；浅色换暖色，避免米白底发灰 */
  .glow {
    position: absolute;
    inset: -25%;
    pointer-events: none;
    background:
      radial-gradient(42% 38% at 22% 24%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 68%),
      radial-gradient(36% 32% at 78% 30%, rgba(167, 139, 250, 0.10), transparent 68%),
      radial-gradient(46% 40% at 58% 84%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%);
    filter: blur(46px);
    animation: drift 22s ease-in-out infinite alternate;
  }
  [data-theme="light"] .glow {
    background:
      radial-gradient(44% 40% at 20% 22%, rgba(224, 168, 96, 0.10), transparent 68%),
      radial-gradient(40% 36% at 80% 32%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 68%),
      radial-gradient(46% 40% at 58% 84%, rgba(224, 168, 96, 0.07), transparent 70%);
  }
  @keyframes drift {
    from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
    to { transform: translate3d(2%, 1.5%, 0) scale(1.06); }
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(110% 85% at 50% 42%, transparent 42%, rgba(0, 0, 0, 0.46) 100%);
  }
  [data-theme="light"] .vignette {
    background: radial-gradient(110% 85% at 50% 42%, transparent 44%, rgba(74, 60, 40, 0.12) 100%);
  }

  /* ================= 进度卡片 ================= */
  .card {
    position: relative;
    z-index: 2;
    width: 408px;
    padding: 26px 28px 24px;
    border-radius: 20px;
    background: linear-gradient(158deg,
      color-mix(in srgb, var(--bg-raised) 84%, transparent),
      color-mix(in srgb, var(--bg-panel) 92%, transparent));
    -webkit-backdrop-filter: blur(22px) saturate(1.45);
    backdrop-filter: blur(22px) saturate(1.45);
    border: 1px solid var(--border-soft);
    box-shadow: var(--shadow-modal), 0 1px 0 var(--hairline) inset;
    animation: cardIn 0.55s cubic-bezier(0.22, 0.8, 0.3, 1) both;
    transition: opacity 0.55s ease, transform 0.55s ease, background 0.3s ease;
  }
  [data-theme="light"] .card {
    background: linear-gradient(158deg,
      color-mix(in srgb, #FFFFFF 94%, transparent),
      color-mix(in srgb, var(--bg-raised) 96%, transparent));
    border-color: var(--border);
    -webkit-backdrop-filter: blur(22px) saturate(1.2);
    backdrop-filter: blur(22px) saturate(1.2);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.975); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card.done { animation: none; opacity: 0; transform: translateY(-8px) scale(0.985); }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(140deg, var(--accent-border), var(--border-soft) 38%, var(--accent-soft));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .head { display: flex; align-items: center; gap: 13px; margin-bottom: 6px; }

  .orb {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    flex: none;
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    display: grid;
    place-items: center;
  }
  .orb::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent-border);
    animation: breathe 2.6s ease-in-out infinite;
  }
  .orb::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 20px;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; transform: scale(0.94); }
    50% { opacity: 1; transform: scale(1.04); }
  }

  .titles { min-width: 0; }
  .h { font-size: 16px; font-weight: 500; color: var(--text-1); letter-spacing: 0.2px; line-height: 1.35; }
  .sub {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.5;
    transition: opacity 0.18s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bar {
    margin-top: 22px;
    height: 6px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
    position: relative;
  }
  .fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #FFFFFF));
    box-shadow: 0 0 14px var(--accent-soft);
    transition: width 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
    position: relative;
    overflow: hidden;
  }
  .fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 22%, rgba(255, 255, 255, 0.42) 50%, transparent 78%);
    animation: shimmer 1.9s linear infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-110%); }
    to { transform: translateX(110%); }
  }

  .foot {
    margin-top: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .foot b { font-weight: 400; color: var(--text-2); }

  /* 原型控制条 */
  .controls {
    position: absolute;
    right: 20px;
    bottom: 16px;
    z-index: 3;
    display: flex;
    gap: 8px;
  }
  .ctrl {
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: color-mix(in srgb, var(--bg-raised) 70%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--text-3);
    font-size: 11.5px;
    font-family: var(--font);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s ease, color 0.2s ease;
  }
  .ctrl:hover { opacity: 1; color: var(--text-1); }

  @media (prefers-reduced-motion: reduce) {
    .glow, .orb::before, .orb::after, .fill::after { animation: none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="titlebar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="tb-title">Stash · 我的一生</div>
    <div class="tb-right"><span>—</span><span>□</span><span>×</span></div>
  </div>

  <div class="body">
    <aside class="sidebar">
      <div class="lib-name"><span></span>我的一生</div>
      <div class="new-btn">＋ 新建文件夹</div>
      <div>
        <div class="sec-label">文件夹</div>
        <div class="tree">
          <div class="on"><i></i>全部素材<em>8,241</em></div>
          <div><i></i>旅行<em>1,203</em></div>
          <div><i></i>家人<em>2,880</em></div>
          <div><i></i>2024 年<em>1,644</em></div>
          <div><i></i>截图<em>913</em></div>
          <div><i></i>待整理<em>1,601</em></div>
        </div>
      </div>
      <div>
        <div class="sec-label">标签</div>
        <div class="tag-row">
          <span class="tag"><i></i>风景</span>
          <span class="tag"><i></i>人物</span>
          <span class="tag"><i></i>AI</span>
          <span class="tag"><i></i>收藏</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <h2>所有素材</h2>
        <span class="pill">瀑布流</span>
        <span class="pill">最近添加</span>
      </div>
      <div class="grid">
        <div class="tile t1"></div>
        <div class="tile t2"></div>
        <div class="tile t3"></div>
        <div class="tile t4"></div>
        <div class="tile t5"></div>
        <div class="tile t6"></div>
        <div class="tile t7"></div>
        <div class="tile t8"></div>
        <div class="tile t9"></div>
        <div class="tile t10"></div>
        <div class="tile t11"></div>
        <div class="tile t12"></div>
      </div>
    </main>

    <aside class="detail">
      <div class="hero"></div>
      <div class="meta-line w80"></div>
      <div class="meta-line w60"></div>
      <div class="meta-line w45"></div>
      <div class="block"></div>
      <div class="block"></div>
    </aside>
  </div>

  <div class="veil">
    <div class="glow"></div>
    <div class="vignette"></div>

    <div class="card" id="card">
      <div class="head">
        <div class="orb"></div>
        <div class="titles">
          <div class="h">正在打开素材库</div>
          <div class="sub" id="sub">正在连接索引…</div>
        </div>
      </div>
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>
      <div class="foot">
        <span>完成后会自动进入，无需操作</span>
        <b>8,241 个素材</b>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl" id="theme" type="button">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <circle cx="6" cy="6" r="4.2" stroke="currentColor" stroke-width="1.2"/>
        <path d="M6 0.8v1.4M6 9.8v1.4M0.8 6h1.4M9.8 6h1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span id="themeLabel">浅色</span>
    </button>
    <button class="ctrl" id="replay" type="button">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M10.2 6a4.2 4.2 0 1 1-1.3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M9.4 1.3v2.4H7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      重播
    </button>
  </div>
</div>

<script>
  const fill = document.getElementById('fill');
  const sub = document.getElementById('sub');
  const card = document.getElementById('card');
  const replay = document.getElementById('replay');
  const themeBtn = document.getElementById('theme');
  const themeLabel = document.getElementById('themeLabel');

  const phases = [
    { at: 0, text: '正在连接索引…' },
    { at: 1.6, text: '正在读取 8,241 个素材的索引' },
    { at: 5.2, text: '索引较大，正在逐个核对…' },
    { at: 11, text: '正在从磁盘读取，首次打开会慢一些' }
  ];

  const RUN_MS = 13500;
  let start = performance.now();
  let phase = -1;
  let raf = 0;
  let ended = false;

  function setPhase(idx) {
    if (idx === phase) return;
    phase = idx;
    sub.style.opacity = '0';
    window.setTimeout(() => {
      sub.textContent = phases[idx].text;
      sub.style.opacity = '1';
    }, 170);
  }

  function tick(now) {
    if (ended) return;
    const s = (now - start) / 1000;

    let p;
    if (s < 1.2) p = (s / 1.2) * 34;
    else p = 34 + 58 * (1 - Math.exp(-(s - 1.2) / 4.5));
    fill.style.width = Math.min(p, 92) + '%';

    let idx = 0;
    for (let i = 0; i < phases.length; i++) if (s >= phases[i].at) idx = i;
    setPhase(idx);

    if (now - start > RUN_MS) {
      ended = true;
      fill.style.width = '100%';
      window.setTimeout(() => {
        card.classList.add('done');
        window.setTimeout(reset, 700);
      }, 380);
      return;
    }
    raf = requestAnimationFrame(tick);
  }

  function reset() {
    cancelAnimationFrame(raf);
    ended = false;
    phase = -1;

    fill.style.transition = 'none';
    fill.style.width = '0%';
    card.classList.remove('done');

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        fill.style.transition = '';
        start = performance.now();
        raf = requestAnimationFrame(tick);
      });
    });
  }

  replay.addEventListener('click', reset);

  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    themeLabel.textContent = next === 'light' ? '浅色' : '深色';
  });

  raf = requestAnimationFrame(tick);
</script>
</body>
</html>
