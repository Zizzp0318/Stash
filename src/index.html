<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stash · 素材库</title>
    <script>
      // 首帧主题：与 src/utils/theme.ts 的 readThemeHint 同键同口径。
      // 必须写在这里（CSS 之前）—— 否则浅色用户会先看到一帧深色再切过去。
      try {
        var hint = localStorage.getItem('stash.themeHint')
        var light =
          hint === 'light' || (hint !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)
        if (light) document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {
        /* 隐私模式 / localStorage 被禁：按深色走，和 :root 的默认一致 */
      }
    </script>
    <style>
      /*
       * 首屏兜底（放在 #app 里，Vue mount 时整体替换，不需要手动清理）。
       *
       * 为什么必须有：窗口 `ready-to-show` 一到就 show，而 Vue 挂载 + 首次 IPC 往返
       * 在冷启动（Windows 刚开机、exe 还在被 Defender 扫）要几百毫秒到一秒。
       * 这段时间 body 是浏览器默认白底 —— 用户看到的就是「打开软件白屏」。
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0d0e;
      }
      /* 这个阶段 main.css 还没加载，`html,body,#app{height:100%}` 那条还不存在 —— 不补的话骨架会贴在顶部 */
      #app {
        height: 100%;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #e8e4dc;
      }
      body {
        color: #e6e9ef;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html[data-theme="light"] body {
        color: #2b2b2b;
      }
      .boot-splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        /* 无边框窗口：骨架期也要能拖动 */
        -webkit-app-region: drag;
      }
      .boot-splash .mark {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(145deg, #2a2d33, #1a1c21);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .boot-splash .mark::after {
        content: "";
        position: absolute;
        inset: 13px;
        border-radius: 5px;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        border-right-color: transparent;
        border-bottom-color: transparent;
        animation: splash-spin 1.1s linear infinite;
      }
      .boot-splash .title {
        font-size: 13px;
        letter-spacing: 0.4px;
        opacity: 0.72;
      }
      .boot-splash .bar {
        width: 168px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .boot-splash .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.55);
        animation: splash-slide 1.3s ease-in-out infinite;
      }
      html[data-theme="light"] .boot-splash .mark {
        background: linear-gradient(145deg, #fffdf8, #ece7dd);
        border-color: rgba(0, 0, 0, 0.08);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      html[data-theme="light"] .boot-splash .mark::after {
        border-color: rgba(0, 0, 0, 0.45);
        border-right-color: transparent;
        border-bottom-color: transparent;
      }
      html[data-theme="light"] .boot-splash .bar {
        background: rgba(0, 0, 0, 0.1);
      }
      html[data-theme="light"] .boot-splash .bar i {
        background: rgba(0, 0, 0, 0.35);
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash .mark::after,
        .boot-splash .bar i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash">
        <div class="mark"></div>
        <div class="title">Stash</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
    <script>
      /*
       * 骨架已经画到屏幕上了 → 通知主进程「可以显示窗口了」。
       *
       * 为什么不用 did-finish-load：那只表示资源加载完，不代表第一帧已经提交给合成器。
       * 窗口 show 早了，用户看到的是窗口底色（浅米/深黑）——就是「黑框」。
       *
       * 为什么标题而不是 IPC：这个脚本在主进程的页面里跑，拿不到 preload 的能力；
       * `page-title-updated` 是主进程能直接听到的最轻的信号。
       *
       * 两条都挂：隐藏窗口（show:false）时 rAF 可能被节流，定时器兜一条。
       */
      (function () {
        var markReady = function () {
          if (document.title !== 'stash-ready') document.title = 'stash-ready'
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(markReady)
        })
        setTimeout(markReady, 80)
      })()
    </script>
  </body>
</html>
